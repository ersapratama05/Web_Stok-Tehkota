    <script>
      // Guard against Vite HMR WebSocket connection failure in cloud sandbox
      (function () {
        if (typeof window === 'undefined') return;
        window.addEventListener('unhandledrejection', function (e) {
          if (e && e.reason && (String(e.reason.message).includes('WebSocket') || String(e.reason.stack).includes('@vite/client'))) {
            e.preventDefault();
          }
        });
        window.addEventListener('error', function (e) {
          if (e && (String(e.message).includes('WebSocket') || String(e.filename).includes('@vite/client'))) {
            e.preventDefault();
          }
        });
        if (window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function (url, proto) {
            if (proto === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')))) {
              var fake = new EventTarget();
              fake.readyState = 1; // WebSocket.OPEN
              fake.send = function () {};
              fake.close = function () {};
              setTimeout(function () {
                fake.dispatchEvent(new Event('open'));
              }, 0);
              return fake;
            }
            return new OrigWS(url, proto);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }
      })();
    </script>
